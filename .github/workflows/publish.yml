name: Publish Flatpak updates

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to deploy or retry
        required: true
        type: string
      redeploy:
        description: Redeploy the latest published snapshot to repair hosting
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flatpak-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'blueevolution-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      REDEPLOY_RELEASE: ${{ inputs.redeploy && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install publication tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak ostree jq xsltproc libxml2-utils
          npm --prefix packaging ci --ignore-scripts --no-fund --no-audit
          npm --prefix packaging test
          echo "PUBLISH_ROOT=$RUNNER_TEMP/flatpak-publication" >> "$GITHUB_ENV"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Import release signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "${FLATPAK_GPG_PRIVATE_KEY:-}" ]]; then
            echo 'FLATPAK_GPG_PRIVATE_KEY is required.' >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/publication-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" { print $5; exit }')
          test -n "$key_id"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"
      - name: Prepare signed update repository
        id: prepare
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node packaging/publish-flatpak.mjs prepare
      - name: Upload Pages artifact
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/flatpak-publication/site
      - name: Deploy updates
        if: steps.prepare.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_SHA: ${{ steps.prepare.outputs.publication_sha }}
      - name: Record deployed repository state
        if: steps.prepare.outputs.skip != 'true'
        run: node packaging/publish-flatpak.mjs record
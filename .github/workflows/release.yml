name: Build draft release

on:
  push:
    tags:
      - blueevolution-v*
  workflow_dispatch:
    inputs:
      version:
        description: BlueEvolution version, for example 0.1.0 or 0.2.0-rc.1
        required: true
        type: string
      replace_draft:
        description: Replace assets and notes only if the existing release is still a draft
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#blueevolution-v}"
          else
            version="$INPUT_VERSION"
            tag="blueevolution-v${version}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check draft replacement eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          REPLACE_DRAFT: ${{ inputs.replace_draft }}
        shell: bash
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$REPLACE_DRAFT" != "true" || "$is_draft" != "true" ]]; then
              echo "Release $TAG already exists; only explicitly requested draft replacements are allowed." >&2
              exit 1
            fi
          fi

      - name: Install build tools and GNOME runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder jq libxml2-utils xvfb xauth
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --assumeyes flathub org.gnome.Sdk//49 org.gnome.Platform//49

      - name: Import optional Flatpak signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "${FLATPAK_GPG_PRIVATE_KEY:-}" ]]; then
            echo "FLATPAK_GPG_PRIVATE_KEY is not configured; this draft will be unsigned."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" { print $5; exit }')
          if [[ -z "$key_id" ]]; then
            echo "The configured FLATPAK_GPG_PRIVATE_KEY contains no secret key." >&2
            exit 1
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"

      - name: Build Flatpak and checksum
        env:
          BLUEEVOLUTION_VERSION: ${{ steps.release.outputs.version }}
          BUILD_ROOT: ${{ runner.temp }}/blueevolution-flatpak
          BUNDLE_PATH: ${{ runner.temp }}/BlueEvolution-${{ steps.release.outputs.version }}-x86_64.flatpak
        run: |
          node scripts/import-bootstrap-icons.mjs --check
          packaging/build-flatpak.sh

      - name: Verify bundle checksum and account-free regressions
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cd "$RUNNER_TEMP"
          sha256sum --check "BlueEvolution-${VERSION}-x86_64.flatpak.sha256"
          mkdir -p "$RUNNER_TEMP/regression-profile"/{home,config,data,cache}
          xvfb-run --auto-servernum flatpak-builder --run \
            --socket=x11 --nosocket=wayland --unshare=network \
            --filesystem="$RUNNER_TEMP/regression-profile" \
            "$RUNNER_TEMP/blueevolution-flatpak/app" \
            "$RUNNER_TEMP/blueevolution-flatpak/manifest.json" \
            /usr/bin/env \
            HOME="$RUNNER_TEMP/regression-profile/home" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/regression-profile/config" \
            XDG_DATA_HOME="$RUNNER_TEMP/regression-profile/data" \
            XDG_CACHE_HOME="$RUNNER_TEMP/regression-profile/cache" \
            GDK_BACKEND=x11 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 \
            GSETTINGS_SCHEMA_DIR=/app/share/glib-2.0/schemas \
            /bin/sh -eu -c '
              for test in test-blueevolution-mail-list test-ui-action test-blueevolution-appearance; do
                "/app/libexec/blueevolution/tests/$test"
              done
            '

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUNDLE: ${{ runner.temp }}/BlueEvolution-${{ steps.release.outputs.version }}-x86_64.flatpak
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [[ -n "${FLATPAK_GPG_PRIVATE_KEY:-}" ]]; then
            signing_status="The OSTree commit is GPG-signed; the corresponding public key is embedded in the bundle."
          else
            signing_status="This draft is unsigned. The SHA-256 file detects corruption but is not a publisher signature."
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## BlueEvolution ${VERSION}

          **Platform:** Kubuntu and other x86_64 Linux desktops with Flatpak.
          **Upstream baseline:** GNOME Evolution 3.62.1, Evolution Data Server 3.62.1, Evolution EWS 3.62.1.

          ### Install

          Install with: flatpak install --user --bundle $(basename "$BUNDLE")

          The bundle uses the GNOME 49 runtime. Launch with: flatpak run io.github.themetalleg.BlueEvolution

          ### Integrity and updates

          ${signing_status} The accompanying SHA-256 file also detects accidental corruption. Flatpak-managed updates are not yet published; install a newer release bundle manually. GitHub release notes and mail content are never executed by the app.

          GitHub provides the corresponding source archives with this release.
          EOF
          if [[ "$VERSION" == "0.2.0-beta.1" ]]; then
            printf '\n' >> "$RUNNER_TEMP/release-notes.md"
            cat RELEASE_NOTES.md >> "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Create or replace draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          REPLACE_DRAFT: ${{ inputs.replace_draft }}
          BUNDLE: ${{ runner.temp }}/BlueEvolution-${{ steps.release.outputs.version }}-x86_64.flatpak
        shell: bash
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$REPLACE_DRAFT" != "true" || "$is_draft" != "true" ]]; then
              echo "Release $TAG cannot be replaced; published versioned assets are immutable." >&2
              exit 1
            fi
            gh release upload "$TAG" "$BUNDLE" "$BUNDLE.sha256" --clobber
            gh release edit "$TAG" --draft --prerelease="$PRERELEASE" \
              --title "BlueEvolution $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA"
            exit 0
          fi
          args=("$TAG" "$BUNDLE" "$BUNDLE.sha256" --draft --title "BlueEvolution $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
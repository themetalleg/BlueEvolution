name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            version: 0.2.0
          - channel: beta
            version: 0.2.0-beta.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder jq libxml2-utils xsltproc xvfb xauth ostree

      - name: Test channel identities and signed updates
        env:
          BLUEEVOLUTION_TEST_FLATPAK: '1'
        run: |
          npm --prefix packaging ci --ignore-scripts --no-fund --no-audit
          npm --prefix packaging test

      - name: Install GNOME SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --assumeyes flathub org.gnome.Sdk//49 org.gnome.Platform//49

      - name: Validate metadata and packaging identity
        run: |
          node scripts/import-bootstrap-icons.mjs --check
          xmllint --noout \
            data/io.github.themetalleg.BlueEvolution.gschema.xml.in \
            data/org.gnome.Evolution.metainfo.xml.in.in \
            data/icons/hicolor_apps_scalable_blueevolution.svg
          jq -e '
            .["app-id"] == "io.github.themetalleg.BlueEvolution" and
            .command == "blueevolution" and
            (.["finish-args"] | any(. == "--env=GSETTINGS_BACKEND=keyfile"))
          ' flatpak/io.github.themetalleg.BlueEvolution.json

      - name: Build Flatpak bundle
        env:
          BLUEEVOLUTION_VERSION: ${{ matrix.version }}
          BLUEEVOLUTION_CHANNEL: ${{ matrix.channel }}
          BUILD_ROOT: ${{ runner.temp }}/blueevolution-build
          FLATPAK_STATE_DIR: ${{ runner.temp }}/flatpak-state
          BUNDLE_PATH: ${{ runner.temp }}/BlueEvolution-ci-x86_64.flatpak
        run: |
          packaging/build-flatpak.sh

      - name: Verify executable in isolated profile
        run: |
          mkdir -p "$RUNNER_TEMP/blueevolution-home" "$RUNNER_TEMP/blueevolution-config" "$RUNNER_TEMP/blueevolution-data" "$RUNNER_TEMP/blueevolution-cache"
          flatpak-builder --run \
            --env=HOME="$RUNNER_TEMP/blueevolution-home" \
            --env=XDG_CONFIG_HOME="$RUNNER_TEMP/blueevolution-config" \
            --env=XDG_DATA_HOME="$RUNNER_TEMP/blueevolution-data" \
            --env=XDG_CACHE_HOME="$RUNNER_TEMP/blueevolution-cache" \
            --env=GSETTINGS_BACKEND=memory \
            "$RUNNER_TEMP/blueevolution-build/app" \
            "$RUNNER_TEMP/blueevolution-build/manifest.json" \
            /app/bin/blueevolution --help

      - name: Run account-free regression tests
        env:
          APP_ID: ${{ matrix.channel == 'beta' && 'io.github.themetalleg.BlueEvolution.Beta' || 'io.github.themetalleg.BlueEvolution' }}
        run: |
          mkdir -p "$RUNNER_TEMP/regression-profile"/{home,config,data,cache}
          flatpak install --user --assumeyes --bundle "$RUNNER_TEMP/BlueEvolution-ci-x86_64.flatpak"
          dbus-run-session -- xvfb-run --auto-servernum flatpak run --user \
            --socket=x11 --nosocket=wayland --unshare=network \
            --filesystem="$RUNNER_TEMP/regression-profile" \
            --command=/usr/bin/env "$APP_ID" \
            HOME="$RUNNER_TEMP/regression-profile/home" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/regression-profile/config" \
            XDG_DATA_HOME="$RUNNER_TEMP/regression-profile/data" \
            XDG_CACHE_HOME="$RUNNER_TEMP/regression-profile/cache" \
            GDK_BACKEND=x11 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 \
            BLUEEVOLUTION_REQUIRE_DOWNLOAD_POLICY=1 \
            GSETTINGS_SCHEMA_DIR=/app/share/glib-2.0/schemas \
            /bin/sh -eu -c '
              for test in test-blueevolution-mail-list test-mail-download-policy test-ui-action test-blueevolution-appearance test-integrations; do
                "/app/libexec/blueevolution/tests/$test"
              done
            '

      - uses: actions/upload-artifact@v4
        with:
          name: BlueEvolution-${{ matrix.channel }}-candidate-x86_64
          path: |
            ${{ runner.temp }}/BlueEvolution-ci-x86_64.flatpak
            ${{ runner.temp }}/BlueEvolution-ci-x86_64.flatpak.sha256